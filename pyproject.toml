[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-ot"
version = "0.2.0"
description = "HELLO: dual-guided hierarchical optimal transport with CUDA, C++ CPU and PyTorch backends"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "torch>=2.5",
    "POT>=0.9.7,<1",
    "numba>=0.59,<1",
]

[project.optional-dependencies]
experiments = ["pyyaml>=6", "pandas>=2", "matplotlib>=3.8"]
dataset-build = ["safetensors", "tqdm"]
ott = ["jax==0.4.25", "ott-jax==0.4.6"]
reproduce = ["numpy>=1.26,<2", "pykeops==2.3", "matplotlib>=3.8", "pytest>=8"]
test = ["pytest>=8"]
native-build = ["ninja>=1.11", "pybind11==2.12.*"]
cpp-build = ["pybind11>=2.12,<3", "wheel", "setuptools>=69", "threadpoolctl>=3,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hello_ot", "hello_ot.*"]
